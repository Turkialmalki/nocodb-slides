<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#2C7A9E;--brand-deep:#1C5A75;--brand-ink:#123c50;--green:#8CC63F;--line:#c9d4d9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#cfd8dc;font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
  #deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  /* viewport that holds the scaled frame */
  #viewport{position:relative}
  .frame-wrap{position:absolute;top:0;left:0;transform-origin:top left;box-shadow:0 24px 70px rgba(15,45,60,.28);border-radius:10px;overflow:hidden;background:#F5F7F8}
  iframe{border:0;display:block;background:#F5F7F8}
  .frame-wrap.hidden{display:none}

  /* ---- control bar ---- */
  #bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;direction:ltr;
       display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
       background:rgba(18,60,80,.92);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(10,35,50,.35)}
  #bar button{border:0;cursor:pointer;font-family:inherit;color:#eaf3f7;background:transparent;
       width:34px;height:34px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #bar button:hover{background:rgba(255,255,255,.14)}
  #bar button:active{transform:scale(.92)}
  #bar button:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:7px;align-items:center;padding:0 8px}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.32);cursor:pointer;transition:.2s;border:0;padding:0}
  .dot.on{background:var(--green);width:24px;border-radius:6px}
  .dot:hover{background:rgba(255,255,255,.6)}
  #count{color:#cfe0e7;font-family:"IBM Plex Sans";font-size:12px;font-weight:600;min-width:44px;text-align:center;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
  #title{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;color:#123c50;
       font-weight:600;font-size:13px;background:rgba(255,255,255,.78);padding:5px 16px;border-radius:999px;
       box-shadow:0 4px 14px rgba(15,45,60,.12);backdrop-filter:blur(6px)}
  #fs{margin-inline-start:4px}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
  @media (max-width:640px){#title{font-size:11px}#bar button{width:30px;height:30px}}
</style>
</head>
<body>
<div id="deck"><div id="viewport"></div></div>
<div id="title"></div>
<div id="bar">

  <div class="sep"></div>
  <button id="prev" title="السابق">‹</button>
  <div class="dots" id="dots"></div>
  <span id="count"></span>
  <button id="next" title="التالي">›</button>
</div>

<style>

    --teal:#327395; --green:#8DBC54; --green-deep:#6b9a37;
    --bg:#EFEFF0; --card:#FFFFFF; --line:#DCE1E4;

  *{box-sizing:border-box;margin:0;padding:0}

  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative}

  .kicker .k2{font-weight:600;font-size:12px;color:var(--muted)}
  .kicker .k1b{font-family:"IBM Plex Sans";font-weight:600;font-size:10px;letter-spacing:2px;color:var(--teal);text-transform:uppercase}
  .hexmotif{position:absolute;bottom:-26px;left:-24px;width:208px;height:208px;z-index:0}
  .foot{position:absolute;bottom:22px;right:48px;font-family:"IBM Plex Sans";font-size:10.5px;color:var(--muted);letter-spacing:.6px;z-index:6}

  .content{position:absolute;top:104px;inset-inline:52px;bottom:52px;z-index:3;display:flex;flex-direction:column}
  h1{font-weight:700;font-size:33px;color:var(--brand-deep);letter-spacing:-.2px}
  h1 .en{display:block;font-family:"IBM Plex Sans";font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.4px;margin-top:5px}
  .lead{font-size:14.5px;color:#4a5a62;max-width:1040px;margin-top:10px;line-height:1.55}
  .lead b{color:var(--brand-deep)}

  .ph{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .ph .hd{padding:16px 19px;color:#fff;position:relative}
  .ph.p1 .hd{background:linear-gradient(120deg,#2f7092,#255a78)}

  .ph.p3 .hd{background:linear-gradient(120deg,#307094,#1d485f)}
  .ph .num{font-family:"IBM Plex Sans";font-size:11px;font-weight:600;letter-spacing:1px;opacity:.85;text-transform:uppercase}

  <div class="content">
    <h1>خطة التطبيق على ثلاث مراحل<span class="en">A three-phase rollout plan — from quick launch to full automation</span></h1>
    <p class="lead">خطة واضحة نبدؤها فورًا وننتهي بأتمتة كاملة يديرها الفريق. كل مرحلة تُثمر نتيجة ملموسة وتبني على ما قبلها.</p>

    <div class="phases">
      <div class="ph p1">
        <div class="hd"><div class="num">المرحلة الأولى</div><div class="ttl">الإطلاق السريع</div><div class="when">🗓️ الأسبوع الأول</div></div>
        <div class="bd">
          <div class="step"><span class="n">1</span><span class="t"><b>ربط نماذج الموقع</b> بقاعدة البيانات آليًا، بدل الإدخال اليدوي.</span></div>
          <div class="step"><span class="n">2</span><span class="t"><b>توحيد شكل البيانات</b> الواردة من المصدر مباشرة.</span></div>
          <div class="step"><span class="n">3</span><span class="t"><b>ضبط الصلاحيات</b> للجداول المرجعية والفِرق.</span></div>
        </div>
        <div class="out">النتيجة: <b>توقّف إعادة الإدخال</b> وبيانات تصل موحّدة.</div>
      </div>

      <div class="ph p2">
        <div class="hd"><div class="num">المرحلة الثانية</div><div class="ttl">تحسين الجودة</div><div class="when">🗓️ الأسبوعان الثاني والثالث</div></div>
        <div class="bd">
          <div class="step"><span class="n">1</span><span class="t"><b>تنظيف تلقائي</b> يوحّد الأرقام والبريد ويصحّح الصيغ.</span></div>
          <div class="step"><span class="n">2</span><span class="t"><b>إزالة التكرار</b> في المستفيدين والشركات آليًا.</span></div>
          <div class="step"><span class="n">3</span><span class="t"><b>تدقيق دوري</b> يعمل بضغطة زر أو بموعد ثابت.</span></div>
        </div>
        <div class="out">النتيجة: <b>بيانات نظيفة وموثوقة</b> دون جهد يدوي.</div>
      </div>

      <div class="ph p3">
        <div class="hd"><div class="num">المرحلة الثالثة</div><div class="ttl">الأتمتة الكاملة</div><div class="when">🗓️ الأسبوع الرابع فما بعد</div></div>
        <div class="bd">
          <div class="step"><span class="n">1</span><span class="t"><b>مسارات مرئية</b> يبنيها ويصونها الفريق بلا برمجة.</span></div>
          <div class="step"><span class="n">2</span><span class="t"><b>إثراء بالذكاء الاصطناعي</b> لتصنيف الطلبات وتلخيصها.</span></div>
          <div class="step"><span class="n">3</span><span class="t"><b>تنبيهات فورية</b> للمسؤولين عند كل حدث مهم.</span></div>
        </div>
        <div class="out">النتيجة: <b>تشغيل ذاتي</b> بإشراف بسيط من الفريق.</div>
      </div>

  window.addEventListener('resize',fit);fit();
<\/script>

  .kicker .k2{font-weight:600;font-size:12px;color:var(--muted)}
  .kicker .k1b{font-family:"IBM Plex Sans";font-weight:600;font-size:10px;letter-spacing:2px;color:var(--teal);text-transform:uppercase}
  .hexmotif{position:absolute;bottom:-26px;left:-24px;width:208px;height:208px;z-index:0}
  .foot{position:absolute;bottom:22px;right:48px;font-family:"IBM Plex Sans";font-size:10.5px;color:var(--muted);letter-spacing:.6px;z-index:6}
  .pageno{position:absolute;bottom:22px;left:52px;font-family:"IBM Plex Sans";font-weight:700;font-size:12px;color:var(--brand-deep);z-index:6}
  .content{position:absolute;top:104px;inset-inline:52px;bottom:52px;z-index:3;display:flex;flex-direction:column}
  h1{font-weight:700;font-size:33px;color:var(--brand-deep);letter-spacing:-.2px}
  h1 .en{display:block;font-family:"IBM Plex Sans";font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.4px;margin-top:5px}
  .lead{font-size:14.5px;color:#4a5a62;max-width:1040px;margin-top:10px;line-height:1.55}
  .lead b{color:var(--brand-deep)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:17px 19px}


  .row{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:18px;min-height:0}
  .maps{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 20px;display:flex;flex-direction:column;justify-content:center}
  .maph{font-weight:700;font-size:14px;color:var(--brand-ink);padding:12px 0 10px;border-bottom:2px solid var(--line);display:grid;grid-template-columns:1fr 40px 1fr;align-items:center}
  .maph span{font-family:"IBM Plex Sans";font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
  .maph .cu{text-align:start} .maph .nc{text-align:start;color:var(--brand-deep)}
  .maprow{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f4}
  .maprow:last-child{border-bottom:none}
  .maprow .cu{font-size:13px;color:var(--muted)}
  .maprow .arw{color:var(--green-deep);font-weight:700;text-align:center;font-size:16px}
  .maprow .nc{font-size:13px;color:var(--brand-ink);font-weight:600}
  .bens{display:flex;flex-direction:column;gap:13px}
  .benh{font-weight:700;font-size:15px;color:var(--brand-deep)}
  .ben{background:linear-gradient(135deg,#fff,#f4f9f5);border:1px solid #d6e7c9;border-radius:14px;padding:13px 16px;display:flex;gap:13px;align-items:center}
  .ben .ic{width:40px;height:40px;border-radius:11px;background:var(--green-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .ben .t{font-weight:700;font-size:13.5px;color:var(--brand-ink)}
  .ben .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .hero{margin-top:16px;background:linear-gradient(100deg,#20586f,#2f7092);border-radius:14px;padding:13px 20px;display:flex;align-items:center;gap:14px;color:#eaf4f8}
  .hero .big{font-weight:700;font-size:15px;color:#fff}
  .hero .sm{font-size:12px;margin-top:3px;opacity:.92}
  .hero .em{font-size:26px}

</style>
</head>
<body>
<div id="stage"><div class="slide" id="slide">
  <div class="brand"><span class="ar">مركز الابتكار</span><span class="en">Innovation Center</span></div>
  <div class="kicker"><div class="k1b">NocoDB · البديل المتكامل</div></div>
  <svg class="hexmotif" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><path d="M78.0 150.0 L65.0 172.5 L39.0 172.5 L26.0 150.0 L39.0 127.5 L65.0 127.5 Z" fill="none" stroke="#327395" stroke-width="9" stroke-linejoin="round" opacity="0.9"/><path d="M126.0 120.0 L111.0 146.0 L81.0 146.0 L66.0 120.0 L81.0 94.0 L111.0 94.0 Z" fill="#8DBC54" opacity="1"/><path d="M172.0 150.0 L161.0 169.1 L139.0 169.1 L128.0 150.0 L139.0 130.9 L161.0 130.9 Z" fill="none" stroke="#327395" stroke-width="9" stroke-linejoin="round" opacity="0.5"/><path d="M134.0 186.0 L122.0 206.8 L98.0 206.8 L86.0 186.0 L98.0 165.2 L122.0 165.2 Z" fill="#327395" opacity="0.9"/><path d="M78.0 200.0 L68.0 217.3 L48.0 217.3 L38.0 200.0 L48.0 182.7 L68.0 182.7 Z" fill="none" stroke="#8DBC54" stroke-width="9" stroke-linejoin="round" opacity="0.8"/><path d="M170.0 196.0 L161.0 211.6 L143.0 211.6 L134.0 196.0 L143.0 180.4 L161.0 180.4 Z" fill="#8DBC54" opacity="0.85"/><path d="M46.0 120.0 L38.0 133.9 L22.0 133.9 L14.0 120.0 L22.0 106.1 L38.0 106.1 Z" fill="none" stroke="#327395" stroke-width="9" stroke-linejoin="round" opacity="0.35"/></svg>
  <div class="content">
    <h1>منصّة واحدة تُغني عن ClickUp<span class="en">One platform that replaces ClickUp — on your own network</span></h1>
    <p class="lead">كل ما تستخدمونه في ClickUp موجود في NocoDB — لكن على <b>شبكتكم وبياناتكم</b>، وبلا اشتراك شهري لكل مستخدم.</p>

    <div class="row">
      <div class="maps">
        <div class="maph"><div class="cu">في ClickUp</div><div></div><div class="nc">في NocoDB</div></div>
        <div class="maprow"><div class="cu">المهام والعروض</div><div class="arw">←</div><div class="nc">جداول · كانبان · تقويم · Gantt</div></div>
        <div class="maprow"><div class="cu">لوحات المتابعة</div><div class="arw">←</div><div class="nc">لوحات ومؤشّرات حيّة</div></div>
        <div class="maprow"><div class="cu">الأتمتة</div><div class="arw">←</div><div class="nc">مسارات مرئية وأوامر</div></div>
        <div class="maprow"><div class="cu">المستندات</div><div class="arw">←</div><div class="nc">وثائق مدمجة</div></div>
        <div class="maprow"><div class="cu">النماذج</div><div class="arw">←</div><div class="nc">نماذج جمع بيانات</div></div>
        <div class="maprow"><div class="cu">المراجعة والتعليق</div><div class="arw">←</div><div class="nc">تعليقات على الصور والملفات</div></div>
      </div>

      <div class="bens">
        <div class="benh">لماذا NocoDB أفضل لكم؟</div>
        <div class="ben"><div class="ic">🛡️</div><div><div class="t">بياناتكم داخل شبكتكم</div><div class="d">لا تغادر خوادم منشآت — أمان وسيادة كاملة على المعلومات.</div></div></div>
        <div class="ben"><div class="ic">💰</div><div><div class="t">بلا اشتراك لكل مستخدم</div><div class="d">توفير مستمر مقارنةً برسوم ClickUp الشهرية المتصاعدة.</div></div></div>
        <div class="ben"><div class="ic">🤖</div><div><div class="t">أتمتة وذكاء اصطناعي مدمج</div><div class="d">كل ما سبق في مكان واحد، دون أدوات أو ربط خارجي إضافي.</div></div></div>
      </div>
    </div>

    <div class="hero">
      <span class="em">✅</span>
      <div><div class="big">منصّة واحدة، على بنيتكم، تجمع كل شيء</div><div class="sm">جداول ولوحات وأتمتة ونماذج ووثائق — بديل متكامل يُلغي الحاجة إلى ClickUp.</div></div>

  </div>
  <div class="pageno">06</div>
  <div class="foot">مركز الابتكار · 2026</div>
</div></div>
<script>
  function fit(){var s=document.getElementById('slide'),st=document.getElementById('stage');
    var k=Math.min(window.innerWidth/1280,window.innerHeight/720);
    s.style.transform='scale('+k+')';s.style.transformOrigin='top left';
    st.style.width=(1280*k)+'px';st.style.height=(720*k)+'px';}
  window.addEventListener('resize',fit);fit();
<\/script>

{kind:'app',title:`استوديو الأتمتة`,html:`<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو الأتمتة — Automation Studio · مركز الابتكار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#307094; --brand-deep:#255a78; --brand-ink:#1d485f;
    --green:#8DBC54; --green-deep:#6b9a37; --amber:#E8A33D; --red:#E05A4E; --purple:#7A6FB0;
    --bg:#EFEFF0; --card:#FFFFFF; --ink:#233139; --muted:#66757D; --line:#DCE1E4;
    --soft:#F5F8FA;
    --shadow:0 8px 26px rgba(20,55,72,.10); --shadow-lg:0 16px 44px rgba(20,55,72,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .mono{font-family:"IBM Plex Mono",monospace}
  .en{font-family:"IBM Plex Sans"}

  /* header */
  header{background:linear-gradient(120deg,#123c50,#1C5A75 60%,#2C7A9E);color:#eaf4f8;padding:16px 30px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40;box-shadow:0 4px 20px rgba(18,60,80,.25)}
  .hmark{width:34px;height:38px;flex:none}
  .htitle{flex:1}
  .htitle .t{font-weight:700;font-size:18px;letter-spacing:.2px}
  .htitle .s{font-size:11px;color:#bcd8e4;margin-top:1px}
  .hbrand{text-align:end;line-height:1.2}
  .hbrand .a{font-weight:700;font-size:15px}
  .hbrand .b{font-size:9px;color:#bcd8e4;letter-spacing:2px;text-transform:uppercase;font-family:"IBM Plex Sans"}
  .netpill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 11px;border-radius:20px;font-size:10.5px;color:#d7ebf2}
  .netpill .d{width:7px;height:7px;border-radius:50%;background:#8CC63F;box-shadow:0 0 0 3px rgba(140,198,63,.25)}

  .wrap{max-width:1240px;margin:0 auto;padding:22px 26px 60px}
  .intro{display:flex;gap:16px;align-items:stretch;margin-bottom:18px;flex-wrap:wrap}
  .intro .lead{flex:1;min-width:320px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px}
  .intro .lead h1{font-size:20px;color:var(--brand-deep);font-weight:700}
  .intro .lead p{font-size:13px;color:var(--muted);line-height:1.55;margin-top:6px}
  .intro .lead .tag{display:inline-block;margin-top:9px;font-size:11px;color:var(--green-deep);background:#eef7e3;border:1px solid #d3e9bb;border-radius:20px;padding:3px 11px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:300px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:12px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--brand)}
  .kpi.g::before{background:var(--green)} .kpi.a::before{background:var(--amber)}
  .kpi .n{font-family:"IBM Plex Sans";font-weight:700;font-size:26px;color:var(--brand-deep);line-height:1}
  .kpi.g .n{color:var(--green-deep)} .kpi.a .n{color:#c98603}
  .kpi .l{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35}

  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;box-shadow:var(--shadow)}
  .tab .em{font-size:15px}
  .tab.active{color:#fff;background:linear-gradient(120deg,#1C5A75,#2C7A9E);border-color:transparent}
  .tab:not(.active):hover{color:var(--brand-deep);border-color:var(--brand)}

  .panel{display:none}
  .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* workflow layout */
  .wf{display:grid;grid-template-columns:270px 1fr 300px;gap:16px;align-items:start}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .box .bh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .box .bh .em{font-size:15px}
  .box .bh .t{font-weight:700;font-size:13px;color:var(--brand-ink)}
  .box .bh .t small{display:block;font-weight:500;font-size:9.5px;color:var(--muted);font-family:"IBM Plex Sans"}
  .box .bb{padding:13px 15px}

  /* incoming queue */
  .sub{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px;cursor:default;transition:.15s;position:relative;background:var(--soft)}
  .sub.next{border-color:var(--brand);box-shadow:0 0 0 3px rgba(44,122,158,.12)}
  .sub .form{font-size:10px;color:#fff;background:var(--brand);border-radius:6px;padding:2px 7px;display:inline-block;font-weight:600}
  .sub.done{opacity:.5}
  .sub .nm{font-weight:600;font-size:12.5px;margin-top:6px}
  .sub .fld{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center}
  .sub .fld .mono{font-size:10px;color:#7a5a2a}
  .sub .warn{color:var(--amber)}
  .sub .badge{position:absolute;top:9px;inset-inline-end:10px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
  .sub .badge.dup{background:#fdeceb;color:#b23227;border:1px solid #f3c9c5}

  .btn{width:100%;border:none;border-radius:11px;padding:12px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .btn.primary{background:linear-gradient(120deg,#2C7A9E,#1C5A75);color:#fff;box-shadow:0 6px 16px rgba(28,90,117,.35)}
  .btn.primary:hover{filter:brightness(1.06)} .btn.primary:active{transform:translateY(1px)}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
  .btn.ghost{background:var(--soft);color:var(--brand-deep);border:1px solid var(--line);box-shadow:none;margin-top:8px}
  .btn.ghost:hover{border-color:var(--brand)}

  /* flow canvas */
  .flow{display:flex;flex-direction:column;gap:0;position:relative}
  .node{display:flex;gap:13px;align-items:flex-start;padding:12px 15px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);position:relative;transition:.25s;z-index:2}
  .node .ic{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:#9fb0b8;transition:.25s}
  .node .body{flex:1;min-width:0}
  .node .k{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
  .node .h{font-weight:700;font-size:13.5px;color:var(--ink);margin-top:1px}
  .node .h .en{font-weight:500;font-size:10.5px;color:var(--muted);margin-inline-start:6px}
  .node .msg{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;min-height:15px;transition:.2s}
  .node .msg b{color:var(--brand-deep)}
  .node .msg .ok{color:var(--green-deep);font-weight:600}
  .node .msg .sk{color:var(--amber);font-weight:600}
  .node .st{position:absolute;top:12px;inset-inline-end:14px;font-size:15px;opacity:0;transition:.2s}
  .connector{width:2px;height:16px;background:var(--line);margin-inline-start:34px;transition:.25s;z-index:1}
  .connector.on{background:var(--brand)}
  /* active/done node states colored per node via data attr */
  .node.active{border-color:var(--brand);box-shadow:0 0 0 4px rgba(44,122,158,.13),var(--shadow)}
  .node.active .ic{transform:scale(1.06)}
  .node.done .st{opacity:1}
  .node[data-c="trigger"].lit .ic{background:var(--brand)}
  .node[data-c="valid"].lit .ic{background:var(--green-deep)}
  .node[data-c="dedup"].lit .ic{background:var(--amber)}
  .node[data-c="ai"].lit .ic{background:var(--purple)}
  .node[data-c="create"].lit .ic{background:var(--brand)}
  .node[data-c="notify"].lit .ic{background:var(--green-deep)}

  /* right column: table + log */
  .grid-tbl{width:100%;border-collapse:collapse;font-size:11px}
  .grid-tbl th{font-family:"IBM Plex Sans";font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600}
  .grid-tbl td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
  .grid-tbl .tname{font-weight:600;color:var(--ink)}
  .grid-tbl .meta{font-size:9.5px;color:var(--muted)}
  .grid-tbl .chip{font-size:9px;background:#e8f1f5;color:var(--brand-deep);border:1px solid #cfe3eb;border-radius:5px;padding:1px 5px;display:inline-block;margin-top:3px}
  .grid-tbl tr.new td{animation:rowin .5s ease}
  @keyframes rowin{from{background:#eaf7e0}to{background:transparent}}
  .empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:11.5px}

  .console{background:#0f2733;border-radius:0 0 13px 13px;padding:12px 14px;font-family:"IBM Plex Mono";font-size:11px;color:#a9d7ea;max-height:210px;overflow-y:auto;line-height:1.65}
  .console .ln{opacity:0;animation:lnin .3s forwards}
  @keyframes lnin{to{opacity:1}}
  .console .tt{color:#5f8496}
  .console .g{color:#a6dd6f} .console .y{color:#f0c04a} .console .b{color:#6cc4ee} .console .p{color:#c3a4ef}

  /* script tab */
  .sc{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  pre.code{background:#0f2733;border-radius:13px;padding:16px;font-family:"IBM Plex Mono";font-size:11.5px;color:#cfe6f0;line-height:1.7;overflow-x:auto;box-shadow:var(--shadow)}
  pre.code .c{color:#5f8496} pre.code .k{color:#6cc4ee} pre.code .s{color:#a6dd6f} pre.code .f{color:#f0c04a} pre.code .v{color:#c3a4ef}
  .dtbl{width:100%;border-collapse:collapse;font-size:11px}
  .dtbl th{font-size:9.5px;color:var(--muted);text-transform:uppercase;text-align:start;padding:7px 9px;border-bottom:1px solid var(--line);font-weight:600;font-family:"IBM Plex Sans"}
  .dtbl td{padding:7px 9px;border-bottom:1px solid var(--soft);font-family:"IBM Plex Mono";font-size:10.5px}
  .dirty{color:#b23227} .clean{color:var(--green-deep);font-weight:500}
  .rowdup{background:#fdeceb!important}
  .flash{animation:flash .6s ease}
  @keyframes flash{0%{background:#fff6d9}100%{background:transparent}}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px;padding:11px 14px;background:var(--soft);border:1px solid var(--line);border-radius:11px}
  .note b{color:var(--brand-deep)}
  .valstrip{display:grid;grid-template-columns:1fr 44px 1fr;align-items:stretch;gap:12px;margin-bottom:18px}
  .vs{border-radius:14px;padding:14px 18px;border:1px solid var(--line)}
  .vs .vh{font-weight:700;font-size:14px;margin-bottom:9px}
  .vs ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .vs li{font-size:12.5px;line-height:1.4}
  .vs.before{background:linear-gradient(135deg,#fdf3f1,#fbf6f4);border-color:#f0d9d3}
  .vs.before .vh{color:#b0442a} .vs.before li{color:#7a4a3f}
  .vs.after{background:linear-gradient(135deg,#f1f8ec,#f5faf0);border-color:#d6e7c9}
  .vs.after .vh{color:var(--green-deep)} .vs.after li{color:#3c5a22}
  .vsarrow{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--green-deep);font-weight:700}
  @media(max-width:1080px){.valstrip{grid-template-columns:1fr}.vsarrow{transform:rotate(90deg)}}
  @media(max-width:1080px){.wf{grid-template-columns:1fr}.sc{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="htitle"><div class="t">استوديو الأتمتة · Automation Studio</div><div class="s">محاكاة تفاعلية تُريك قيمة الأتمتة عمليًا — كيف يتحوّل الطلب من نموذج الموقع إلى سجلّ جاهز دون تدخّل يدوي</div></div>

  <div class="hbrand"><div class="a">مركز الابتكار</div><div class="b">Innovation Center</div></div>
</header>

<div class="wrap">
  <div class="intro">
    <div class="lead">
      <h1>من نموذج الموقع إلى NocoDB — بلا إدخال يدوي</h1>
      <p>هذه محاكاة حيّة تُظهر كيف «تتعبّأ» البيانات من مصدرها تلقائيًا: يصل طلب من نموذج مركز الابتكار، فيتحقق منه ويوحّده ويمنع التكرار ويثريه بالذكاء الاصطناعي، ثم يُنشئ السجل في الجدول الصحيح ويُشعر المسؤول — دون أن يلمس الفريق لوحة المفاتيح.</p>

  </div>

  <div class="valstrip">
    <div class="vs before">
      <div class="vh">قبل الأتمتة</div>

  <!-- ============ WORKFLOW PANEL ============ -->

      <!-- incoming queue -->

          <div id="queue"></div>

      <!-- flow -->

            </div>
            <div class="connector"></div>
            <div class="node" data-c="dedup" data-i="2">
              <div class="ic">🔎</div><div class="body"><div class="k">الخطوة ٣ · منع التكرار</div><div class="h">منع التكرار<span class="en">Dedup</span></div><div class="msg" data-def="مطابقة بالبريد/الشركة الموحّدة"></div></div><div class="st">✓</div>
            </div>

            <div class="connector"></div>

              <div class="ic">➕</div><div class="body"><div class="k">الخطوة ٥ · حفظ السجلّ</div><div class="h">كتابة في الجدول<span class="en">Write to table</span></div><div class="msg" data-def="جدول الشركات · المستفيدين · التسجيل"></div></div><div class="st">✓</div>
            </div>
            <div class="connector"></div>
            <div class="node" data-c="notify" data-i="5">
              <div class="ic">🔔</div><div class="body"><div class="k">الخطوة ٦ · التنبيه</div><div class="h">إشعار المسؤول<span class="en">Notify owner</span></div><div class="msg" data-def="رسالة للمالك المسؤول عن الجدول"></div></div><div class="st">✓</div>

      <div>
        <div class="box"><div class="bh"><span class="em">📜</span><div class="t">سكربت التنظيف<small>NocoDB Script · JavaScript</small></div></div>
          <div class="bb" style="padding:0">
<pre class="code"><span class="c">// يُشغَّل من زر داخل الصف أو بجدولة زمنية</span>
<span class="k">const</span> rows = <span class="k">await</span> table.<span class="f">getRecords</span>(<span class="s">'company_profile'</span>);

<span class="k">for</span> (<span class="k">const</span> r <span class="k">of</span> rows) {
  <span class="c">// توحيد الجوال إلى +9665XXXXXXXX</span>
  r.phone = <span class="f">normalizePhone</span>(r.phone);
  <span class="c">// توحيد البريد (حروف صغيرة + إزالة مسافات)</span>
  r.email = r.email.<span class="f">trim</span>().<span class="f">toLowerCase</span>();
  <span class="c">// بصمة لكشف التكرار</span>
  r.key = <span class="f">SHA256</span>(r.email + <span class="s">'|'</span> + r.name);
}

<span class="k">const</span> unique = <span class="f">dedupeBy</span>(rows, <span class="s">'key'</span>);
<span class="k">await</span> table.<span class="f">bulkUpdate</span>(unique);
<span class="v">output</span>.<span class="f">markdown</span>(<span class="s">\`✅ نُظّف \${rows.length} صفًا · أُزيل \${rows.length-unique.length} مكرّرًا\`</span>);</pre>
          </div>
        </div>
        <button class="btn primary" id="btn-clean" style="margin-top:14px">▶ شغّل السكربت على البيانات</button>
        <div class="note"><b>الفكرة:</b> بدل تصحيح كل صف يدويًا، سكربت واحد يوحّد الهواتف والبريد ويزيل التكرار عبر بصمة <span class="mono">SHA256</span> — على كامل الجدول في ثانية، ويُشغَّل بزر أو تلقائيًا كل ليلة.</div>
      </div>
      <div class="box"><div class="bh"><span class="em">🗂️</span><div class="t">البيانات — قبل / بعد<small>company_profile</small></div></div>
        <div class="bb" style="padding:0">
          <table class="dtbl"><thead><tr><th>الشركة</th><th>الجوال</th><th>البريد</th><th>الحالة</th></tr></thead>
            <tbody id="scrows"></tbody>

        </div>

<script>
/* ---------- data ---------- */
const submissions = [
  {form:"رواد الابتكار", name:"شركة نُواة التقنية", email:"INFO@NUWAH.CO ", phone:"0555 12 34 56",
   founder:"سارة العتيبي", req:"منصة توصيل ذكية للمنشآت الصغيرة", sector:null, dup:false, table:"company_profile"},
  {form:"الدعم التقني", name:"Nuwah Tech", email:"info@nuwah.co", phone:"+966555123456",
   founder:"Sarah A.", req:"دعم بنية سحابية", sector:null, dup:true, table:"—"},
  {form:"الاحتضان", name:"مِعمار الحلول", email:"contact@meamar.sa", phone:"0533-221-100",
   founder:"خالد الدوسري", req:"روبوت خدمة عملاء بالعربية", sector:null, dup:false, table:"company_profile"},
  {form:"رواد الابتكار", name:"طيف للبيانات", email:"Hello@Tyfe.io", phone:"056 998 7711",
   founder:"نورة القحطاني", req:"تحليلات بيانات للقطاع الصحي", sector:null, dup:false, table:"company_profile"}
];
const sectors = {"شركة نُواة التقنية":"لوجستيات · Logtech","مِعمار الحلول":"ذكاء اصطناعي · AI","طيف للبيانات":"تحليلات صحية · HealthData"};

let qi=-1, current=null, running=false;
let stats={proc:0,dup:0,saved:0};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);

/* ---------- tabs ---------- */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  $$('.panel').forEach(p=>p.classList.remove('active'));
  $('#panel-'+t.dataset.tab).classList.add('active');
});

/* ---------- queue render ---------- */
function fmtPhone(p){return p.replace(/\\s|-/g,'');}
function renderQueue(){
  const q=$('#queue');q.innerHTML='';
  submissions.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sub'+(i===qi?' next':'')+(i<qi?' done':'')+(i>qi?' pending':'');
    if(i>qi) d.style.opacity='.45';
    d.innerHTML=\`<span class="form">\${s.form}</span>
      \${s.dup?'<span class="badge dup">مكرر محتمل</span>':''}
      <div class="nm">\${s.name}</div>
      <div class="fld">☎ <span class="mono \${/\\s|-/.test(s.phone)?'warn':''}">\${s.phone}</span></div>
      <div class="fld">✉ <span class="mono \${/[A-Z]|\\s$/.test(s.email)?'warn':''}">\${s.email.trim()}</span></div>\`;
    q.appendChild(d);
  });
}
function resetNodes(){
  $$('.node').forEach(n=>{n.classList.remove('active','done','lit');
    const m=n.querySelector('.msg');m.textContent=m.dataset.def;m.style.color='';});
  $$('.connector').forEach(c=>c.classList.remove('on'));
}

/* ---------- console ---------- */
function log(html){
  const c=$('#console');const l=document.createElement('div');l.className='ln';
  const now=new Date();const ts=String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  l.innerHTML=\`<span class="tt">[\${ts}]</span> \${html}\`;c.appendChild(l);c.scrollTop=c.scrollHeight;
}

/* ---------- controls ---------- */
$('#btn-next').onclick=()=>{
  if(running)return;
  if(qi>=submissions.length-1){log('<span class="y">انتهت جميع الطلبات — أعد التعيين للبدء من جديد</span>');return;}
  qi++;current=submissions[qi];resetNodes();renderQueue();
  $('#btn-run').disabled=false;
  log(\`<span class="b">وصل طلب جديد</span> من نموذج «\${current.form}» — <b>\${current.name}</b>\`);
};
$('#btn-run').onclick=()=>{ if(!current||running)return; runFlow(); };
$('#btn-reset').onclick=()=>{
  qi=-1;current=null;running=false;stats={proc:0,dup:0,saved:0};
  updKpis();resetNodes();renderQueue();
  $('#records').innerHTML='<tr><td colspan="2"><div class="empty">لا سجلات بعد — شغّل الأتمتة لتظهر هنا</div></td></tr>';
  $('#console').innerHTML='<div class="ln"><span class="tt">[ready]</span> بانتظار التشغيل…</div>';
  $('#btn-run').disabled=false;
};
function updKpis(){$('#k-proc').textContent=stats.proc;$('#k-dup').textContent=stats.dup;$('#k-saved').textContent=stats.saved;}

/* ---------- the flow ---------- */
function stepNode(i){return new Promise(res=>{
  const node=$(\`.node[data-i="\${i}"]\`),conn=$$('.connector')[i-1],msg=node.querySelector('.msg');
  if(conn)conn.classList.add('on');
  node.classList.add('active','lit');
  setTimeout(()=>{
    const s=current;
    if(i===0){msg.innerHTML=\`استلام طلب <b>\${s.form}</b>\`;}
    if(i===1){msg.innerHTML=\`الجوال ← <b class="mono">\${'+966'+fmtPhone(s.phone).replace(/^0/,'').replace(/^\\+?966/,'')}</b> · البريد ← <b class="mono">\${s.email.trim().toLowerCase()}</b> <span class="ok">✓ صالح</span>\`;}
    if(i===2){ if(s.dup){msg.innerHTML=\`<span class="sk">تطابُق مع سجل قائم — رُبِط دون تكرار</span>\`;}
               else{msg.innerHTML=\`لا تطابق — <span class="ok">سجل جديد</span>\`;} }
    if(i===3){ if(s.dup){msg.innerHTML=\`<span class="sk">تخطٍّ — لا حاجة لإثراء المكرر</span>\`;}
               else{msg.innerHTML=\`القطاع: <b>\${sectors[s.name]||'عام'}</b> · مُلخّص الطلب مُولّد\`;} }
    if(i===4){ if(s.dup){msg.innerHTML=\`<span class="sk">لم يُكتب سجل جديد (رُبِط بالقائم)</span>\`;}
               else{msg.innerHTML=\`أُنشئ سجل في <b class="mono">\${s.table}</b>\`;addRecord(s);} }
    if(i===5){ msg.innerHTML=\`أُرسِل إشعار للمالك <span class="ok">✓</span>\`; }
    node.classList.add('done');
    setTimeout(res,120);
  },520);
});}

async function runFlow(){
  running=true;$('#btn-run').disabled=true;$('#btn-next').disabled=true;
  const s=current;
  log(\`<span class="p">▶ workflow</span> بدأ لـ <b>\${s.name}</b>\`);
  for(let i=0;i<6;i++){
    await stepNode(i);
    if(i===1)log(\`توحيد: جوال وبريد <span class="g">صالح</span>\`);
    if(i===2){ if(s.dup){log(\`<span class="y">⚠ تكرار مُكتشف</span> — رُبِط بالسجل القائم، لن يُنشأ صف جديد\`);stats.dup++;}
               else log(\`فحص التكرار: <span class="g">سجل فريد</span>\`);}
    if(i===3&&!s.dup)log(\`<span class="p">AI</span> صنّف القطاع: <b>\${sectors[s.name]||'عام'}</b>\`);
    if(i===4&&!s.dup)log(\`<span class="g">+ سجل</span> كُتب في <b>\${s.table}</b>\`);
    if(i===5)log(\`🔔 أُشعر المالك المسؤول\`);
  }
  stats.proc++; stats.saved+=s.dup?3:5; updKpis();
  log(\`<span class="g">✔ اكتمل</span> — \${s.dup?'بلا إدخال يدوي، وبلا تكرار':'سجل نظيف ومُثرى بلا لمسة يد'}\`);
  running=false;$('#btn-next').disabled=false;
  if(qi>=submissions.length-1)log(\`<span class="y">تمت معالجة كل الطلبات آليًا 🎉</span>\`);
}

function addRecord(s){
  const tb=$('#records');
  if(tb.querySelector('.empty'))tb.innerHTML='';
  const tr=document.createElement('tr');tr.className='new';
  tr.innerHTML=\`<td><span class="tname">\${s.name}</span><div class="meta">\${s.founder} · \${s.form}</div><span class="chip">\${s.table}</span></td>
                <td>\${sectors[s.name]||'عام'}<div class="meta mono">AI‑tagged</div></td>\`;
  tb.appendChild(tr);
}

/* ---------- script tab ---------- */
const rawRows=[
  {name:"نُواة التقنية", phone:"0555 12 34 56", email:"INFO@NUWAH.CO ", dup:false},
  {name:"Nuwah Tech",    phone:"+966555123456", email:"info@nuwah.co",  dup:true},
  {name:"مِعمار الحلول", phone:"0533-221-100",  email:"Contact@Meamar.sa", dup:false},
  {name:"طيف للبيانات",  phone:"056 998 7711",  email:"Hello@Tyfe.io ", dup:false}
];
function renderScript(cleaned){
  const tb=$('#scrows');tb.innerHTML='';
  const shown = cleaned ? rawRows.filter(r=>!r.dup) : rawRows;
  shown.forEach(r=>{
    const tr=document.createElement('tr');
    if(cleaned)tr.className='flash';
    const phone = cleaned ? '+966'+r.phone.replace(/\\s|-/g,'').replace(/^\\+?966/,'').replace(/^0/,'') : r.phone;
    const email = cleaned ? r.email.trim().toLowerCase() : r.email.trim();
    const cls = cleaned?'clean':'dirty';
    tr.innerHTML=\`<td>\${r.name}</td><td class="\${cls}">\${phone}</td><td class="\${cls}">\${email}</td>
      <td>\${cleaned?'<span class="clean">✓ نظيف</span>':(r.dup?'<span class="dirty">مكرر</span>':'<span class="dirty">غير موحّد</span>')}</td>\`;
    if(!cleaned&&r.dup)tr.classList.add('rowdup');
    tb.appendChild(tr);
  });
}
$('#btn-clean').onclick=()=>{ renderScript(true);
  const btn=$('#btn-clean');btn.textContent='✅ نُظّف 4 صفوف · أُزيل مكرر واحد';btn.disabled=true;
  setTimeout(()=>{btn.disabled=false;btn.textContent='↺ شغّل مرة أخرى';btn.onclick=()=>{renderScript(false);btn.textContent='▶ شغّل السكربت على البيانات';btn.onclick=$('#btn-clean').onclick;location.reload();};},1400);
};

/* ---------- init ---------- */
renderQueue();$('#btn-run').disabled=true;renderScript(false);
<\/script>
</body>
</html>
`}
];
const vp = document.getElementById('viewport');
const dotsEl = document.getElementById('dots');
const countEl = document.getElementById('count');
const titleEl = document.getElementById('title');
let cur = 0;
const wraps = [];

// build frames once
SLIDES.forEach((s,i)=>{
  const w = document.createElement('div');
  w.className = 'frame-wrap' + (i===0?'':' hidden');
  const f = document.createElement('iframe');
  f.setAttribute('scrolling', s.kind==='app'?'yes':'no');
  f.srcdoc = s.html;
  w.appendChild(f);
  vp.appendChild(w);
  wraps.push({wrap:w, frame:f, kind:s.kind});
  const d = document.createElement('button');
  d.className = 'dot'+(i===0?' on':'');
  d.title = s.title;
  d.onclick = ()=>go(i);
  dotsEl.appendChild(d);
});

const BASE_W = 1280, BASE_H = 720;
const PAD = 70; // room for the control bar / title

function layout(){
  const availW = window.innerWidth  - 48;
  const availH = window.innerHeight - PAD - 24;
  wraps.forEach((o,i)=>{
    if(i!==cur) return;
    let k, fw, fh;
    if(o.kind==='app'){
      // app flows vertically: match horizontal scale, fill height, scroll inside
      k  = Math.min(availW/BASE_W, 1);
      fw = BASE_W;
      fh = Math.max(BASE_H, Math.round(availH / k));
    }else{
      k  = Math.min(availW/BASE_W, availH/BASE_H);
      fw = BASE_W; fh = BASE_H;
    }
    o.frame.style.width  = fw+'px';
    o.frame.style.height = fh+'px';
    o.wrap.style.width   = fw+'px';
    o.wrap.style.height  = fh+'px';
    o.wrap.style.transform = 'scale('+k+')';
    // center inside viewport
    const dispW = fw*k, dispH = fh*k;
    vp.style.width  = dispW+'px';
    vp.style.height = dispH+'px';
  });
}

function go(i){
  if(i<0||i>=SLIDES.length) return;
  wraps[cur].wrap.classList.add('hidden');
  cur = i;
  wraps[cur].wrap.classList.remove('hidden');
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  countEl.textContent = (cur+1)+' / '+SLIDES.length;
  titleEl.textContent = SLIDES[cur].title;
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===SLIDES.length-1;
  layout();
}
// LTR control bar: prev(‹) = back, next(›) = forward
document.getElementById('next').onclick = ()=>go(cur+1);
document.getElementById('prev').onclick = ()=>go(cur-1);
document.getElementById('fs').onclick = toggleFs;

function toggleFs(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){})().catch(()=>{}); }
  else{ document.exitFullscreen&&document.exitFullscreen(); }
}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(SLIDES.length-1);}
  else if(e.key==='f'||e.key==='F'){toggleFs();}
});
window.addEventListener('resize',layout);
go(0);
</script>
</body>
</html>
